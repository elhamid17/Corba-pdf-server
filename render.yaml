# ═══════════════════════════════════════════════════════════════
#  Render Blueprint — déploiement en 1 clic
#  https://render.com/docs/blueprint-spec
# ═══════════════════════════════════════════════════════════════

services:
  # ── Backend : API Gateway mono-service (Docker, free 512 MB) ──
  - type: web
    name: corba-pdf-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    region: frankfurt          # plus proche du Sénégal/Europe
    plan: free
    healthCheckPath: /api/v1/pdf/ping
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xmx420m -Xss256k -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom
      - key: CORS_ALLOWED_ORIGINS
        # Render assigne <name>.onrender.com ; ajuste si custom domain
        value: https://corba-pdf.onrender.com
      # ── MongoDB (a renseigner manuellement dans le dashboard Render) ──
      # Utiliser une connection string Atlas : mongodb+srv://user:pass@cluster.mongodb.net/corba_pdf?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false
      # ── Secret JWT (genere une chaine aleatoire >= 32 octets) ──
      - key: JWT_SECRET
        sync: false
      # ── Credentials admin (optionnel, defaut admin / admin123) ──
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── Frontend : React statique (free, CDN, jamais de cold start) ──
  - type: web
    name: corba-pdf
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # SPA fallback
    envVars:
      - key: VITE_API_URL
        value: https://corba-pdf-api.onrender.com
