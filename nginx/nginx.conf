# ═══════════════════════════════════════════
# Nginx — Reverse proxy CORBA PDF Server
# ═══════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Taille max des uploads (PDFs)
    client_max_body_size 150M;

    sendfile        on;
    keepalive_timeout 65;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Compression gzip ──
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    server {
        listen 80;
        server_name _;

        # ── API REST → api-gateway Spring Boot ──
        # CORS est entierement geree par Spring (CorsConfig + allowCredentials=true).
        # Nginx ne doit RIEN ajouter ici, sinon le navigateur recoit des headers
        # contradictoires (Origin * vs origin specifique, methodes incompletes
        # cf. PATCH/DELETE admin) et refuse la requete avec credentials.
        location /api/ {
            proxy_pass         http://api-gateway:8080/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout long pour les gros PDFs
            proxy_read_timeout    300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
        }

        # ── Health check ──
        location /health {
            proxy_pass http://api-gateway:8080/actuator/health;
        }

        # ── Frontend React (servi par son propre conteneur) ──
        location / {
            proxy_pass       http://frontend:80/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;

            # Support du routing React (SPA)
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}