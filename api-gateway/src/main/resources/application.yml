server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework

spring:
  application:
    name: corba-pdf-gateway
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB       # taille max d'un PDF uploadé
      max-request-size: 150MB   # pour la fusion de plusieurs PDFs

  # ── MongoDB (comptes utilisateurs, jobs, GridFS) ──
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:corba_pdf}
      username: ${MONGO_USER:corba}
      password: ${MONGO_PASSWORD:corba_dev_pwd}
      authentication-database: admin
      auto-index-creation: true

# ── Configuration CORBA ──
corba:
  host: ${CORBA_HOST:localhost}  # variable d'env Docker, localhost en dev
  port: ${CORBA_PORT:2809}
  service-name: PDFService
  timeout: 30000                 # timeout connexion en ms

# ── Actuator (health check pour Docker) ──
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# ── Logging ──
logging:
  level:
    sn.ussein: INFO
    org.springframework: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} — %msg%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

  # ── Quotas par role (cf. plan etape 1) ──
  quota:
    guest:
      max-bytes: 20971520        # 20 MB
      retention-hours: 24
      max-files: 3
    user:
      max-bytes: 209715200       # 200 MB
      retention-days: 30
    admin:
      max-bytes: -1              # illimite

  # ── JWT ──
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string}
    expiration-hours: 24

  # ── Compte admin cree au premier demarrage ──
  admin:
    email: ${ADMIN_EMAIL:admin@corba-pdf.local}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
