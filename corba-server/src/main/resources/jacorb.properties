# ═══ Configuration JacORB ═══
# Projet : CORBA PDF Server — USSEIN L2 AgroTIC

# Port IIOP du serveur CORBA
OAPort=2809

# Adresse d'écoute (0.0.0.0 = toutes les interfaces)
OAIAddr=0.0.0.0

# Naming Service — hôte et port
ORBInitRef.NameService=corbaloc::localhost:2809/NameService

# Logging JacORB (0=off, 1=fatal, 2=error, 3=warn, 4=info, 6=debug)
jacorb.log.default.verbosity=3

# Taille max des messages gérés par buffer (réduite pour éviter une
# allocation excessive au démarrage de l'ORB dans un conteneur limité)
jacorb.maxManagedBufSize=1048576

# Timeout de connexion en millisecondes
jacorb.connection.client.connect_timeout=30000

# Répertoire temporaire pour les fichiers IDL générés
jacorb.implname=PDFServer
