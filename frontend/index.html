<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="CORBA PDF Suite — plateforme distribuée de traitement PDF. Fusion, OCR, signature, compression, conversion." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CORBA PDF Suite — Traitement PDF distribué</title>
    <script>
      // Theme: applique .dark sur <html> AVANT le rendu React pour eviter le FOUC.
      // 'auto' (defaut) suit prefers-color-scheme ; 'light'/'dark' forcent.
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'auto'
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = pref === 'dark' || (pref === 'auto' && systemDark)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* localStorage indisponible — on reste en clair */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
