# ═══════════════════════════════════════════════════════
# Docker Compose — PDF Suite (monolithe modulaire, JVM unique)
# USSEIN L2 AgroTIC
# ═══════════════════════════════════════════════════════

services:

  # ── 1. MongoDB — comptes utilisateurs, jobs, GridFS ─
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    expose:
      - "27017"         # Interne — jamais expose publiquement
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-corba}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-corba_dev_pwd}
      - MONGO_INITDB_DATABASE=corba_pdf
      - TZ=Africa/Dakar
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── 2. API Gateway Spring Boot (embarque pdf-engine in-process) ─
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    expose:
      - "8080"          # Interne — accessible via Nginx uniquement
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
      - frontend
    volumes:
      # Données Tesseract embarquées dans l'image (/usr/share/tessdata).
      # Ce montage permet de surcharger/ajouter des modèles de langue sans
      # rebuild. Le code lit TESSDATA_PATH (défaut /usr/share/tessdata).
      - tessdata:/volumes/tessdata
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER:-corba}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-corba_dev_pwd}
      - MONGO_DB=corba_pdf
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      - TZ=Africa/Dakar
    healthcheck:
      test: ["CMD", "wget", "-qO-",
             "http://localhost:8080/api/pdf/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 3. Frontend React ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend
    environment:
      - TZ=Africa/Dakar

  # ── 4. Nginx — point d'entrée public ───────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"         # HTTP public
      - "443:443"       # HTTPS (certificat à configurer)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - frontend
    environment:
      - TZ=Africa/Dakar

# ── Volumes persistants ────────────────────────────────
volumes:
  tessdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/tessdata
  mongo-data:
    driver: local

# ── Réseaux isolés ─────────────────────────────────────
networks:
  backend:
    driver: bridge
    internal: true    # Mongo jamais exposé directement à internet
  frontend:
    driver: bridge
