# ═══════════════════════════════════════════════════════
# Docker Compose — CORBA PDF Server
# USSEIN L2 AgroTIC
# ═══════════════════════════════════════════════════════

services:

  # ── 1. Serveur CORBA + PDFBox ──────────────────────
  corba-server:
    build:
      context: .
      dockerfile: corba-server/Dockerfile
    container_name: corba-server
    restart: unless-stopped
    expose:
      - "2809"          # IIOP interne — NON exposé publiquement
    volumes:
      - pdf-storage:/volumes/pdf-storage
      - tessdata:/volumes/tessdata
    networks:
      - backend
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 2809"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      - TZ=Africa/Dakar

  # ── 2. MongoDB — comptes utilisateurs, jobs, GridFS ─
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    expose:
      - "27017"         # Interne — jamais expose publiquement
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-corba}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-corba_dev_pwd}
      - MONGO_INITDB_DATABASE=corba_pdf
      - TZ=Africa/Dakar
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── 3. API Gateway Spring Boot ─────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    expose:
      - "8080"          # Interne — accessible via Nginx uniquement
    depends_on:
      corba-server:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - backend
      - frontend
    volumes:
      - pdf-storage:/volumes/pdf-storage:ro
    environment:
      - CORBA_HOST=corba-server
      - CORBA_PORT=2809
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER:-corba}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-corba_dev_pwd}
      - MONGO_DB=corba_pdf
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      - TZ=Africa/Dakar
    healthcheck:
      test: ["CMD", "wget", "-qO-",
             "http://localhost:8080/api/pdf/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 4. Frontend React ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend
    environment:
      - TZ=Africa/Dakar

  # ── 5. Nginx — point d'entrée public ───────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"         # HTTP public
      - "443:443"       # HTTPS (certificat à configurer)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - frontend
    environment:
      - TZ=Africa/Dakar

# ── Volumes persistants ────────────────────────────────
volumes:
  pdf-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/pdf-storage
  tessdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/tessdata
  mongo-data:
    driver: local

# ── Réseaux isolés ─────────────────────────────────────
networks:
  backend:
    driver: bridge
    internal: true    # CORBA jamais exposé directement internet
  frontend:
    driver: bridge
