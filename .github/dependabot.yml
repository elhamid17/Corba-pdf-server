# Dependabot — surveillance des dépendances (vulnérabilités + mises à jour).
# Trois écosystèmes : Maven (reactor multi-module), npm (frontend), et les
# GitHub Actions du pipeline lui-même. Cf. note de clôture V2 (étape 2.4).
version: 2
updates:
  # ── Backend Maven (reactor : pom racine + pdf-engine + api-gateway) ──
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "build(deps)"

  # ── Frontend npm ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "build(deps)"

  # ── GitHub Actions (versions des actions du workflow CI) ────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
