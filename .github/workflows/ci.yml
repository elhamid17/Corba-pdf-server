name: CI

# Déclencheurs :
#  - push sur main          → build + tests + build & PUSH de l'image (release)
#  - pull_request vers main  → build + tests + build de l'image SANS push (validation)
#  - workflow_dispatch       → exécution manuelle à la demande
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul run par ref : un nouveau push annule le précédent encore en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend : reactor complet (pdf-engine + api-gateway) ─────────────
  #   `verify` exécute aussi les tests d'intégration Testcontainers
  #   (MongoDB) — Docker est disponible nativement sur ubuntu-latest.
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test (reactor complet)
        run: mvn -B clean verify

  # ── Frontend : tests unitaires (Vitest) + build de production ────────
  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ── E2E : Playwright (mocke l'API, ne nécessite pas le backend) ──────
  #   Déterministe : les appels réseau sont interceptés via page.route.
  #   Dépend de `frontend` pour échouer vite si le front est cassé.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (Chromium + deps système)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Image Docker : build toujours, push sur main uniquement ──────────
  #   Registry : GHCR (ghcr.io/<owner>/<repo>), authentifié via le
  #   GITHUB_TOKEN intégré (aucun secret à configurer). Le push n'a lieu
  #   que sur push vers main ; en PR l'image est seulement construite.
  docker:
    name: Docker image (build, push sur main)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Seulement quand on va réellement pousser (push sur main).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (et push sur main) de l'image gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-gateway/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Scan de vulnérabilités des dépendances (Trivy, mode filesystem) ──
  #   Analyse pom.xml / package-lock.json à chaque run. Complète Dependabot
  #   (qui ouvre les PRs de correctifs) par une visibilité immédiate en CI.
  #   Non bloquant pour l'instant (exit-code 0) : passer exit-code à '1'
  #   pour rendre le pipeline rouge sur CVE HIGH/CRITICAL corrigeable.
  security:
    name: Scan dépendances (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
