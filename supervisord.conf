; ═══════════════════════════════════════════════════════════════
;  supervisord — orchestration des 2 process Java dans un conteneur
;  CORBA server (port 2809 localhost) + API Gateway (port $PORT)
; ═══════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:corba-server]
command=sh -c "java %(ENV_JAVA_OPTS_CORBA)s -Djava.awt.headless=true -Dtessdata.path=%(ENV_TESSDATA_PATH)s -jar /app/corba-server.jar"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api-gateway]
command=sh -c "java %(ENV_JAVA_OPTS_GATEWAY)s -jar /app/api-gateway.jar --server.port=%(ENV_PORT)s --corba.host=%(ENV_CORBA_HOST)s --corba.port=%(ENV_CORBA_PORT)s"
autostart=true
autorestart=true
startsecs=20
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; laisse au corba-server 15 s pour publier l'IOR avant que le gateway démarre
environment=SPRING_MAIN_BANNER_MODE="off"
